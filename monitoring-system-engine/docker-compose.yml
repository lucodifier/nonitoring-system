services:
  monitoring-system-engine:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/monitoring-system-engine:${IMAGE_TAG:-latest}
    container_name: monitoring-system-engine
    ports:
      - "5070:3003"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped
