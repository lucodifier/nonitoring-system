name: 🚀 Deploy to Server 🖥️ - Production

on:
  push:
    branches:
      - main

jobs:
  build-upload:
    name: 🐳 Build and Upload Docker
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Docker Image
        run: |
          docker build --target=prod -t ghcr.io/${{ github.repository }}:latest .

      - name: 🚀 Push Docker Image
        run: |
          docker push ghcr.io/${{ github.repository }}:latest

  deploy:
    name: 🖥️ Deploy to Server
    runs-on: [self-hosted, prod]
    needs: build-upload

    permissions:
      contents: read
      packages: read

    steps:

      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Baixar secrets do Infisical
        run: |
          cd ${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system-worker

          echo "🔑 Baixando secrets do Infisical..."
          infisical export \
          --token ${{ secrets.INFISICAL_TOKEN }} \
          --env=prod \
          --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
          --path="/monitoring-system-worker" \
          --format=dotenv \
          --domain="${{ vars.INFISICAL_DOMAIN }}" \
          > .env

      - name: 🛥️ Deploy Docker container
        run: |
          cd ${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system-worker

          echo "🛑 Parando container atual (se existir)..."
          docker compose down || true

          echo "⬇️ Atualizando imagem..."
          docker compose pull

          echo "🚀 Subindo container atualizado..."
          docker compose up -d

      - name: 🧹 Limpar imagens antigas
        run: docker image prune -f

      - name: 🧹 Limpar .env após deploy
        run: |
          rm -f ${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system-worker/.env
          echo ".env apagado com sucesso"
