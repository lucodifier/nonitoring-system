services:
  monitoring-system-dashboard:
    image: ${IMAGE_REGISTRY:-ghcr.io/your-org}/monitoring-system-dashboard:${IMAGE_TAG:-latest}
    container_name: monitoring-system-dashboard
    ports:
      - "5068:3000"
    env_file:
      - .env
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped