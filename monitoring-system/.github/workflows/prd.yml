name: "🚀 Deploy to Server 🖥️ - Production"

on:
  push:
    branches:
      - master

jobs:
  build-upload:
    name: "🐳 Build and Upload Docker"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Docker Image
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository }}:latest"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=$IMAGE_NAME_LOWER" >> $GITHUB_ENV
          docker build -t "$IMAGE_NAME_LOWER" .

      - name: 🚀 Push Docker Image
        run: |
          docker push "$IMAGE_NAME_LOWER"

  deploy:
    name: "🖥️ Deploy to Server"
    runs-on: [self-hosted, prod]
    needs:  build-upload
    permissions:
      contents: read
      packages: read
    steps:
      - name: 🔐 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🔑 Baixar secrets do Infisical
        shell: bash
        run: |
          set -e
          SERVER_DIR="${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system"
          mkdir -p "$SERVER_DIR"
          cd "$SERVER_DIR"
          echo "🔑 Baixando secrets do Infisical..."
          infisical export \
            --token "${{ secrets.INFISICAL_TOKEN }}" \
            --env=prod \
            --projectId="${{ secrets.INFISICAL_PROJECT_ID }}" \
            --path="/monitoring-system" \
            --format=dotenv \
            --domain="${{ vars.INFISICAL_DOMAIN }}" \
            > .env
          echo "✅ .env gerado em $SERVER_DIR/.env"

      - name: 🛥️ Deploy Docker container
        shell: bash
        run: |
          set -e
          SERVER_DIR="${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system"
          cd "$SERVER_DIR"
          echo "🛑 Parando projeto atual (se existir)..."
          docker compose down --remove-orphans || true
          echo "🧨 Removendo container conflitando por nome (se existir)..."
          docker ps -aq -f name=^/monitoring-system$ | xargs -r docker rm -f
          echo "⬇️ Atualizando imagem..."
          docker compose pull
          echo "🚀 Subindo container atualizado..."
          docker compose up -d --pull always --remove-orphans --force-recreate
          echo "✅ Deploy finalizado"

      - name: 🧹 Limpar imagens antigas
        run: docker image prune -f

      - name: 🧹 Limpar .env após deploy
        shell: bash
        run: |
          SERVER_DIR="${{ vars.DEPLOY_BASE_DIR || '/opt/docker' }}/monitoring-system"
          rm -f "$SERVER_DIR/.env"
          echo ".env apagado com sucesso"


